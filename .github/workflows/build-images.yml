name: Build FortiGate images

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build-images.yml'
      - 'target/**'
      - 'package/**'
      - 'include/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
#          - id: fg60d
#            config: |
#              CONFIG_TARGET_fortisoc=y
#              CONFIG_TARGET_fortisoc_fsoc2=y
#              CONFIG_TARGET_fortisoc_fsoc2_DEVICE_fortinet_fg-60d=y
#            image: bin/targets/fortisoc/fsoc2/openwrt-fortisoc-fsoc2-fortinet_fg-60d-initramfs-kernel.bin
#
#          - id: fg90d
#            config: |
#              CONFIG_TARGET_fortisoc=y
#              CONFIG_TARGET_fortisoc_fsoc2=y
#              CONFIG_TARGET_fortisoc_fsoc2_DEVICE_fortinet_fg-90d=y
#            image: bin/targets/fortisoc/fsoc2/openwrt-fortisoc-fsoc2-fortinet_fg-90d-initramfs-kernel.bin
#
#          - id: fg60e
#            config: |
#              CONFIG_TARGET_fortisoc=y
#              CONFIG_TARGET_fortisoc_fsoc3=y
#              CONFIG_TARGET_fortisoc_fsoc3_DEVICE_fortinet_fg-60e=y
#            image: bin/targets/fortisoc/fsoc3/openwrt-fortisoc-fsoc3-fortinet_fg-60e-initramfs-kernel.bin
#
#          - id: fg100d
#            config: |
#              CONFIG_TARGET_x86=y
#              CONFIG_TARGET_x86_fortigate=y
#              CONFIG_TARGET_x86_fortigate_DEVICE_fortinet_fg-100d=y
#            image: bin/targets/x86/fortigate/openwrt-x86-fortigate-fortinet_fg-100d-initramfs-kernel.bin

          - id: fg100e
            config: |
              CONFIG_TARGET_fortisoc=y
              CONFIG_TARGET_fortisoc_fsoc3=y
              CONFIG_TARGET_fortisoc_fsoc3_DEVICE_fortinet_fg-100e=y
            image: bin/targets/fortisoc/fsoc3/openwrt-fortisoc-fsoc3-fortinet_fg-100e-initramfs-kernel.bin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'main'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip \
            zlib1g-dev file wget

      - name: Update/install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target
        run: |
          cat > .config <<'EOF'
          ${{ matrix.config }}
          EOF
          make defconfig

      - name: Build
        run: make -j"$(nproc)" V=sc

      - name: Collect output
        run: |
          test -f "${{ matrix.image }}"
          mkdir -p out/${{ matrix.id }}
          cp "${{ matrix.image }}" "out/${{ matrix.id }}/$(basename "${{ matrix.image }}")"
          (cd "out/${{ matrix.id }}" && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: out/${{ matrix.id }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            out/**/openwrt-*-initramfs-kernel.bin
            out/**/SHA256SUMS-*.txt
          draft: false
          prerelease: false
