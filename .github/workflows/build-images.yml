name: Build FortiGate images

# This file lives on the default branch of the fork (ci-build) and builds
# another ref, by default main. GitHub reads push workflows from the pushed
# commit, so main (the head of the upstream PR) stays free of it.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to build (a tag v* also creates a release)'
        default: 'main'
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [ci-build]
    paths:
      - '.github/workflows/build-images.yml'

# A build takes longer than the schedule interval: one at a time, the queued
# run then finds the marker and skips.
concurrency:
  group: build-images-${{ inputs.ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      sha: ${{ steps.ref.outputs.sha }}
      skip: ${{ steps.done.outputs.cache-hit }}
    steps:
      - id: ref
        env:
          REF: ${{ inputs.ref || 'main' }}
        run: |
          sha=$(git ls-remote "https://github.com/${{ github.repository }}" "$REF" "refs/tags/$REF^{}" | tail -1 | cut -f1)
          [ -n "$sha" ] || sha="$REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "built-$sha" > marker

      # Scheduled runs skip a commit that was already built (marker in the cache)
      - id: done
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: marker
          key: built-${{ steps.ref.outputs.sha }}
          lookup-only: true

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
#          - id: fg60d
#            config: |
#              CONFIG_TARGET_fortisoc=y
#              CONFIG_TARGET_fortisoc_fsoc2=y
#              CONFIG_TARGET_fortisoc_fsoc2_DEVICE_fortinet_fg-60d=y
#            image: bin/targets/fortisoc/fsoc2/openwrt-fortisoc-fsoc2-fortinet_fg-60d-initramfs-kernel.bin
#
#          - id: fg90d
#            config: |
#              CONFIG_TARGET_fortisoc=y
#              CONFIG_TARGET_fortisoc_fsoc2=y
#              CONFIG_TARGET_fortisoc_fsoc2_DEVICE_fortinet_fg-90d=y
#            image: bin/targets/fortisoc/fsoc2/openwrt-fortisoc-fsoc2-fortinet_fg-90d-initramfs-kernel.bin
#
#          - id: fg60e
#            config: |
#              CONFIG_TARGET_fortisoc=y
#              CONFIG_TARGET_fortisoc_fsoc3=y
#              CONFIG_TARGET_fortisoc_fsoc3_DEVICE_fortinet_fg-60e=y
#            image: bin/targets/fortisoc/fsoc3/openwrt-fortisoc-fsoc3-fortinet_fg-60e-initramfs-kernel.bin
#
#          - id: fg100d
#            config: |
#              CONFIG_TARGET_x86=y
#              CONFIG_TARGET_x86_fortigate=y
#              CONFIG_TARGET_x86_fortigate_DEVICE_fortinet_fg-100d=y
#            image: bin/targets/x86/fortigate/openwrt-x86-fortigate-fortinet_fg-100d-initramfs-kernel.bin

          - id: fg100e
            config: |
              CONFIG_TARGET_fortisoc=y
              CONFIG_TARGET_fortisoc_fsoc3=y
              CONFIG_TARGET_fortisoc_fsoc3_DEVICE_fortinet_fg-100e=y
            image: bin/targets/fortisoc/fsoc3/openwrt-fortisoc-fsoc3-fortinet_fg-100e-initramfs-kernel.bin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip \
            zlib1g-dev file wget

      - name: Update/install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target
        run: |
          cat > .config <<'EOF'
          ${{ matrix.config }}
          EOF
          make defconfig

      - name: Build
        run: make -j"$(nproc)" V=sc

      - name: Collect output
        run: |
          test -f "${{ matrix.image }}"
          mkdir -p out/${{ matrix.id }}
          cp "${{ matrix.image }}" "out/${{ matrix.id }}/$(basename "${{ matrix.image }}")"
          (cd "out/${{ matrix.id }}" && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: out/${{ matrix.id }}

  done:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - run: echo "built-${{ needs.check.outputs.sha }}" > marker
      - uses: actions/cache/save@v4
        with:
          path: marker
          key: built-${{ needs.check.outputs.sha }}

  release:
    needs: [check, build]
    if: startsWith(needs.check.outputs.ref, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.ref }}
          files: |
            out/**/openwrt-*-initramfs-kernel.bin
            out/**/SHA256SUMS
          draft: false
          prerelease: false
